<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="Clase Texturas frankie.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
      <button class="Hotspot" slot="hotspot-1" data-position="-0.117474427002962m 0.5750733500398408m 0.37008076079094354m" data-normal="-0.17782641249451592m 0.7260938318090887m 0.6642029166061566m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Nariz</div>
      </button><button class="Hotspot" slot="hotspot-2" data-position="-0.07045974023208275m 1.0161524932107293m 0.03343472691966376m" data-normal="0.005156107247712066m 0.42560322088626595m 0.9048951944447966m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Cabeza</div>
      </button><button class="Hotspot" slot="hotspot-3" data-position="0.29730677316719606m 0.4508998976640587m 0.02623315226800793m" data-normal="0.498042871592317m 0.08181439015874578m 0.8632842542401845m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Oreja
          </div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
  </body>
</html>
